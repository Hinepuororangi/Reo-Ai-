<!DOCTYPE html>
<html lang="mi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Kupu AI · Kōrero o te Rā</title>
<meta name="theme-color" content="#2f2a24" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<style>
:root{
  --cacao:#2f2a24; --cacao-2:#4a4138; --sand:#f4ede3; --sand-2:#e9dfd0; --white:#fffdf9;
  --sage:#7d8f74; --sage-soft:#e3e9dd; --kokowai:#a4472f; --kokowai-soft:#f3e0d8;
  --ink:#2f2a24; --ink-2:#5c5248; --ink-3:#8a7f73; --border:#ddd2c2;
  --display:'Playfair Display',Georgia,serif; --body:'DM Sans',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--sand);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
button,input,select,textarea{font-family:inherit;font-size:15px}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:88px}
header{background:var(--cacao);color:var(--sand);padding:18px 18px 16px;position:sticky;top:0;z-index:5}
header .brand{font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.7}
header h1{font-family:var(--display);font-size:22px;font-weight:700;margin-top:2px}
header .sub{font-size:12px;opacity:.75;margin-top:2px}
main{padding:16px}
.card{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px}
.label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px;font-weight:600}
.h2{font-family:var(--display);font-size:19px;margin-bottom:4px}
.muted{color:var(--ink-3);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--border);background:var(--white);color:var(--ink-2);border-radius:999px;padding:7px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--cacao);border-color:var(--cacao);color:var(--sand)}
.btn{border:none;border-radius:8px;padding:12px 14px;font-weight:600;cursor:pointer;width:100%}
.btn.primary{background:var(--kokowai);color:#fff}
.btn.dark{background:var(--cacao);color:var(--sand)}
.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--ink-2)}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px}
.row>*{flex:1}
input,select,textarea{width:100%;border:1px solid var(--border);background:var(--white);border-radius:8px;padding:10px 12px;color:var(--ink);margin-bottom:8px}
textarea{min-height:70px;resize:vertical}
.reo{font-family:var(--display);font-size:18px;font-weight:600;color:var(--ink)}
.eng{font-size:13px;color:var(--ink-2)}
.line{padding:12px 0;border-bottom:1px solid var(--sand-2);display:flex;gap:10px;align-items:flex-start}
.line:last-child{border-bottom:none}
.tick{flex:0 0 auto;width:34px;height:34px;border-radius:50%;border:2px solid var(--sage);background:var(--white);color:var(--sage);font-weight:700;cursor:pointer}
.tick.on{background:var(--sage);color:#fff}
.warn{background:var(--kokowai-soft);color:var(--kokowai);border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.ok{background:var(--sage-soft);color:#4d5f45;border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.kupu{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--sand-2)}
.kupu:last-child{border-bottom:none}
.kupu .w{font-weight:600}
.tag{font-size:10px;text-transform:uppercase;letter-spacing:.06em;background:var(--sand);color:var(--ink-3);border-radius:4px;padding:2px 6px;margin-right:4px}
.x{background:none;border:none;color:var(--ink-3);font-size:18px;cursor:pointer;padding:4px 8px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:12px}
.stat b{font-family:var(--display);font-size:26px;display:block}
.stat span{font-size:12px;color:var(--ink-3)}
.bar{height:8px;background:var(--sand-2);border-radius:4px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--sage)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--white);border-top:1px solid var(--border);display:flex;justify-content:center;z-index:5;padding-bottom:env(safe-area-inset-bottom)}
nav .in{display:flex;max-width:560px;width:100%}
nav button{flex:1;background:none;border:none;padding:10px 2px 12px;font-size:11px;color:var(--ink-3);cursor:pointer}
nav button .i{display:block;font-size:19px;margin-bottom:2px}
nav button.on{color:var(--kokowai);font-weight:600}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;animation:s 1s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes s{to{transform:rotate(360deg)}}
.reps{display:flex;align-items:center;gap:8px}
.reps button{width:38px;height:38px;border-radius:50%;border:none;background:var(--cacao);color:var(--sand);font-size:18px;cursor:pointer}
.small{font-size:12px}
.rec{border-color:var(--kokowai);color:var(--kokowai)}
.rec.on{background:var(--kokowai);color:#fff}
.clip{display:inline-flex;align-items:center;background:var(--sage-soft);border-radius:999px;overflow:hidden}
.clip button{background:none;border:none;color:#4d5f45;font-size:13px;padding:6px 10px;cursor:pointer}
.clip .del{padding:6px 8px 6px 0;color:var(--ink-3)}
.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.bubble{padding:10px 12px;border-radius:12px;margin:8px 0;max-width:88%}
.bubble.me{background:var(--cacao);color:var(--sand);margin-left:auto;border-bottom-right-radius:4px}
.bubble.them{background:var(--sand);border-bottom-left-radius:4px}
.fix{background:var(--sage-soft);color:#4d5f45;border-radius:8px;padding:6px 8px;font-size:13px;margin-bottom:6px}
.talkbar{position:sticky;bottom:76px;background:var(--sand);padding:8px 0}
.talk{width:100%;border:none;border-radius:999px;padding:16px;font-size:17px;font-weight:600;background:var(--kokowai);color:#fff;cursor:pointer}
.talk.on{background:var(--cacao);animation:pulse 1.2s ease-in-out infinite}
.talk:disabled{opacity:.5}
@keyframes pulse{50%{opacity:.75}}
.ara-head .shape{display:flex;gap:8px;align-items:center;margin:6px 0 10px;flex-wrap:wrap}
.shape span{font-family:var(--display);font-size:26px;font-weight:700;padding:4px 12px;border-radius:8px}
.shape .mk{background:var(--kokowai);color:#fff}
.shape .slot{border:2px dashed var(--border);color:var(--ink-3);font-family:var(--body);font-size:16px;font-weight:500}
.shape .au{background:var(--sand-2)}
.ladder{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.rung{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--sand);color:var(--ink-3)}
.rung.done{background:var(--sage-soft);color:#4d5f45}
.rung{border:none;cursor:pointer;font-family:inherit}
.rung.sel{outline:2px solid var(--kokowai);outline-offset:1px}
.rung.now{background:var(--cacao);color:var(--sand)}
.seg{display:flex;background:var(--sand-2);border-radius:10px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:none;background:none;padding:9px;border-radius:8px;font-weight:600;color:var(--ink-3);cursor:pointer}
.seg button.on{background:var(--white);color:var(--ink)}
.recall .big{height:190px;display:flex;align-items:center;justify-content:center;background:var(--sand);border-radius:12px;overflow:hidden;margin-bottom:12px}
.recall .big img{width:100%;height:100%;object-fit:cover}
.recall .big .emo{font-size:110px}
.recall .hint{text-align:center;font-family:var(--display);font-size:24px;color:var(--ink-2);margin-bottom:14px;line-height:1.6}
.recall .hint .rb{font-size:30px;vertical-align:-3px;margin:0 2px}
.recall .answer{text-align:center;font-family:var(--display);font-size:26px;font-weight:700;margin:4px 0 14px}
.pics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.pic{position:relative;border:1px solid var(--border);background:var(--white);border-radius:12px;padding:10px;cursor:pointer;transition:transform .1s,background .2s;text-align:center}
.pic .img{height:96px;display:flex;align-items:center;justify-content:center;border-radius:8px;background:var(--sand);overflow:hidden;margin-bottom:8px}
.pic .img img{width:100%;height:100%;object-fit:cover}
.pic .emo{font-size:52px;line-height:1}
.pic .emo.e2{font-size:38px}.pic .emo.e3{font-size:28px}
.recall .big .emo.e2{font-size:80px}.recall .big .emo.e3{font-size:60px}
.pic .reo{font-family:var(--display);font-size:16px;font-weight:600;line-height:1.25}
.pic .n{position:absolute;top:6px;right:8px;font-size:11px;color:#fff;background:var(--sage);border-radius:999px;padding:1px 7px;font-weight:600}
.pic .dot{position:absolute;top:9px;left:9px;width:8px;height:8px;border-radius:50%;background:var(--kokowai)}
.pic.hit{background:var(--sage-soft);transform:scale(.96)}
.pic.editing{cursor:default;border-style:dashed}
.pic .tools{display:flex;gap:4px;justify-content:center;margin-top:8px}
.say-list{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.say{position:relative;text-align:left;border:1px solid var(--border);background:var(--white);border-radius:10px;padding:12px 10px;cursor:pointer;transition:transform .1s,background .2s}
.say .reo{font-size:16px;display:block}
.say .mk-in{color:var(--kokowai)}
.say .eng{font-size:12px;display:block}
.say .n{position:absolute;top:6px;right:8px;font-size:11px;color:var(--sage);font-weight:600}
.say.hit{background:var(--sage-soft);transform:scale(.97)}
details summary{cursor:pointer;color:var(--ink-2);font-size:13px;margin-bottom:6px}
</style>
</head>
